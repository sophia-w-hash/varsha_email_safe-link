<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Console</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f7fc; margin: 0; padding: 20px; color: #333; }
        .hidden { display: none !important; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 20px auto; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1100px; margin: 0 auto; }
        .card { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .counter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .count-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 4px; text-align: center; }
        .count-card span { font-size: 10px; color: #64748b; font-weight: bold; }
        .count-card div { font-size: 18px; font-weight: bold; margin-top: 4px; }
        #sendBtn { background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
        #sendBtn:disabled { background: #9ca3af; cursor: not-allowed; }
        #logArea { background: #0f172a; color: #38bdf8; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 12px; height: 140px; overflow-y: auto; margin-top: 15px; white-space: pre-wrap; }
    </style>
</head>
<body>

<!-- Access Lock Screen -->
<div id="authScreen" style="max-width:350px; margin: 100px auto;" class="card">
    <h3>Protected Access</h3>
    <input type="password" id="passInput" placeholder="Password (##)" style="margin-bottom:10px;">
    <button onclick="checkPass()" style="width:100%; background:#4361ee; color:white; border:none; padding:10px; border-radius:4px; cursor:pointer;">Login</button>
</div>

<!-- Main App Screen -->
<div id="appScreen" class="hidden">
    <div class="top-bar">
        <h2>Mail Console</h2>
        <button id="logoutBtn" style="padding: 6px 12px; cursor:pointer;">Logout (Double Click)</button>
    </div>

    <div class="main-grid">
        <div class="card">
            <h3>Compose</h3>
            <div class="form-row">
                <div>
                    <label>Sender Name</label>
                    <input type="text" id="senderName" placeholder="Your Name" required>
                </div>
                <div>
                    <label>Sender Gmail</label>
                    <input type="email" id="smtpUser" placeholder="you@gmail.com" required>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>App Password</label>
                    <input type="password" id="smtpPass" placeholder="16-digit app password" required>
                </div>
                <div>
                    <label>Subject</label>
                    <input type="text" id="subject" placeholder="Subject line" required>
                </div>
            </div>
            <div>
                <label>Body (Plain Text)</label>
                <textarea id="bodyText" rows="6" placeholder="Type plain text message..." required></textarea>
            </div>
        </div>

        <div>
            <div class="card" style="margin-bottom: 20px;">
                <h3>Recipients</h3>
                <textarea id="recipients" rows="6" placeholder="user1@gmail.com&#10;user2@gmail.com" required></textarea>
            </div>

            <div class="card">
                <h3>Monitor</h3>
                <div class="counter-grid">
                    <div class="count-card"><span>TOTAL</span><div id="cntTotal">0</div></div>
                    <div class="count-card"><span>SENT</span><div id="cntSent" style="color:#10b981;">0</div></div>
                    <div class="count-card"><span>FAILED</span><div id="cntFailed" style="color:#ef4444;">0</div></div>
                    <div class="count-card"><span>REMAINING</span><div id="cntRem">0</div></div>
                </div>
                <button id="sendBtn" onclick="startCampaign()">Send All</button>
                <div id="logArea">Ready...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const AUTH_PASS = "##";

    if (sessionStorage.getItem("auth") === "true") {
        document.getElementById("authScreen").classList.add("hidden");
        document.getElementById("appScreen").classList.remove("hidden");
    }

    function checkPass() {
        if (document.getElementById("passInput").value === AUTH_PASS) {
            sessionStorage.setItem("auth", "true");
            document.getElementById("authScreen").classList.add("hidden");
            document.getElementById("appScreen").classList.remove("hidden");
        } else {
            alert("Wrong Password!");
        }
    }

    document.getElementById("logoutBtn").addEventListener("dblclick", () => {
        sessionStorage.removeItem("auth");
        location.reload();
    });

    async function startCampaign() {
        const sendBtn = document.getElementById('sendBtn');
        const logArea = document.getElementById('logArea');
        
        const payload = {
            senderName: document.getElementById('senderName').value,
            smtpUser: document.getElementById('smtpUser').value,
            smtpPass: document.getElementById('smtpPass').value,
            subject: document.getElementById('subject').value,
            bodyText: document.getElementById('bodyText').value,
            recipients: document.getElementById('recipients').value
        };

        sendBtn.disabled = true;
        sendBtn.innerText = "Sending...";
        logArea.innerText = "Starting...\n";

        try {
            const response = await fetch('/send-bulk-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                logArea.innerText += chunk;
                logArea.scrollTop = logArea.scrollHeight;

                if (chunk.includes("[COUNT_UPDATE]")) {
                    const match = chunk.match(/\[COUNT_UPDATE\] Total:(\d+) Sent:(\d+) Failed:(\d+) Rem:(\d+)/);
                    if (match) {
                        document.getElementById("cntTotal").innerText = match[1];
                        document.getElementById("cntSent").innerText = match[2];
                        document.getElementById("cntFailed").innerText = match[3];
                        document.getElementById("cntRem").innerText = match[4];
                    }
                }
            }
        } catch (err) {
            logArea.innerText += `\nError: ${err.message}`;
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerText = "Send All";
        }
    }
</script>
</body>
</html>
