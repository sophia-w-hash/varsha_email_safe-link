<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 650px;
            border: 1px solid #e2e8f0;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #0284c7;
            font-size: 24px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            color: #0f172a;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus, textarea:focus {
            border-color: #0284c7;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .row .form-group {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0369a1;
        }
        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        .progress-box {
            margin-top: 20px;
            display: none;
        }
        .progress-bar-bg {
            background-color: #e2e8f0;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar-fill {
            background-color: #0284c7;
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }
        .status-text {
            font-size: 14px;
            text-align: center;
            color: #475569;
            font-weight: 500;
        }
        .alert {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
            font-weight: 500;
        }
        .alert-error {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background-color: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Fast Bulk Email Dispatcher</h2>

    <form id="emailForm">
        <div class="row">
            <div class="form-group">
                <label for="gmailUser">Gmail Address</label>
                <input type="email" id="gmailUser" placeholder="your.email@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="appPass">App Password</label>
                <input type="password" id="appPass" placeholder="16-digit app password" required>
            </div>
        </div>

        <div class="form-group">
            <label for="emailListText">Recipient Emails (Comma or Newline separated)</label>
            <textarea id="emailListText" rows="4" placeholder="user1@example.com&#10;user2@example.com" required></textarea>
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="Enter email subject" required>
        </div>

        <div class="form-group">
            <label for="body">Email Message / HTML Template</label>
            <textarea id="body" rows="6" placeholder="Type plain text or paste full HTML template code here..." required></textarea>
        </div>

        <button type="submit" id="sendBtn">Send Emails Now</button>
    </form>

    <div class="progress-box" id="progressBox">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusText">Preparing delivery...</div>
    </div>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>
</div>

<script>
    const form = document.getElementById('emailForm');
    const sendBtn = document.getElementById('sendBtn');
    const progressBox = document.getElementById('progressBox');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';
        
        sendBtn.disabled = true;
        progressBox.style.display = 'block';
        progressFill.style.width = '0%';
        statusText.innerText = 'Connecting to server...';

        const payload = {
            gmailUser: document.getElementById('gmailUser').value,
            appPass: document.getElementById('appPass').value,
            emailListText: document.getElementById('emailListText').value,
            subject: document.getElementById('subject').value,
            body: document.getElementById('body').value
        };

        try {
            const response = await fetch('/api/send-direct', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n\n');
                buffer = lines.pop();

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const jsonStr = line.replace('data: ', '').trim();
                        if (!jsonStr) continue;

                        const data = JSON.parse(jsonStr);

                        if (data.error) {
                            showError(data.error);
                            resetUI();
                            return;
                        }

                        if (data.progress) {
                            const percent = Math.round((data.sent / data.total) * 100);
                            progressFill.style.width = percent + '%';
                            statusText.innerText = `Sent ${data.sent} of ${data.total} emails (${percent}%)`;
                        }

                        if (data.completed) {
                            showSuccess(`Completed! Delivered: ${data.delivered}, Failed: ${data.failed}`);
                            resetUI();
                            return;
                        }
                    }
                }
            }
        } catch (err) {
            showError('Network error or server connection failed.');
            resetUI();
        }
    });

    function resetUI() {
        sendBtn.disabled = false;
        progressBox.style.display = 'none';
    }

    function showError(msg) {
        errorAlert.innerText = msg;
        errorAlert.style.display = 'block';
    }

    function showSuccess(msg) {
        successAlert.innerText = msg;
        successAlert.style.display = 'block';
    }
</script>

</body>
</html>
