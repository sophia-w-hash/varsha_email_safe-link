<script>
    function checkAccess() {
        const pass = document.getElementById('accessPass').value;
        if (pass === '##') {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            sessionStorage.setItem('isUnlocked', 'true');
        } else {
            alert('Wrong Access Password ❌');
        }
    }

    if (sessionStorage.getItem('isUnlocked') === 'true') {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
    }

    function performLogout() {
        sessionStorage.removeItem('isUnlocked');
        document.getElementById('mailForm').reset();
        document.getElementById('accessPass').value = '';
        document.getElementById('counter').innerText = '0 Emails Inputted';
        
        document.getElementById('appContent').style.display = 'none';
        document.getElementById('authOverlay').style.display = 'flex';
    }

    function getValidEmails() {
        const text = document.getElementById('emailListText').value;
        return text.split(/[\n,\s]+/).filter(e => e.trim().includes('@') && e.trim().includes('.'));
    }

    function updateCounter() {
        const emails = getValidEmails();
        document.getElementById('counter').innerText = `${emails.length} Emails Inputted`;
    }

    // High Speed Zero-Latency Stream Processor
    document.getElementById('mailForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const emails = getValidEmails();
        if (emails.length === 0) {
            alert("No valid email addresses found! ❌");
            return;
        }

        const btn = document.getElementById('submitBtn');
        const counter = document.getElementById('counter');
        
        btn.disabled = true;
        btn.innerText = `Sending (0/${emails.length})...`;
        counter.innerText = `Sending (0/${emails.length})`;

        const payload = {
            gmailUser: document.getElementById('gmailUser').value,
            appPass: document.getElementById('appPass').value,
            emailListText: document.getElementById('emailListText').value,
            subject: document.getElementById('subject').value,
            body: document.getElementById('body').value
        };

        try {
            const response = await fetch('/api/send-direct', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            // Instant Loop - Instant Render Batch
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');

                for (let line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.replace('data: ', ''));

                            if (data.error) {
                                alert(data.error);
                                break;
                            }

                            if (data.progress) {
                                // RequestAnimationFrame for 0ms Instant UI Refresh
                                window.requestAnimationFrame(() => {
                                    btn.innerText = `Sending (${data.sent}/${data.total})...`;
                                    counter.innerText = `Sending (${data.sent}/${data.total})`;
                                });
                            }

                            if (data.completed) {
                                counter.innerText = `${data.delivered}/${data.total} Delivered Successfully ✅`;
                                alert(`Mail Send Successful ✅ (${data.delivered}/${data.total})`);
                            }
                        } catch (err) {}
                    }
                }
            }
        } catch (err) {
            alert("Error: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Send";
        }
    });
</script>
