<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Email Dispatcher Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .lock-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .lock-card h3 {
            margin-bottom: 10px;
            color: #0284c7;
            font-size: 22px;
        }
        .lock-card p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 780px;
            border: 1px solid #e2e8f0;
            display: none;
        }
        h2 {
            color: #0284c7;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
        }
        .col {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            color: #0f172a;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus, textarea:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .btn-row {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        button.btn-submit {
            flex: 1;
            padding: 14px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-submit:hover {
            background-color: #0369a1;
        }
        button.btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        .btn-logout {
            flex: 1;
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }
        .btn-logout:hover {
            background-color: #dc2626;
        }
        .progress-box {
            margin-top: 20px;
            display: none;
        }
        .progress-bar-bg {
            background-color: #e2e8f0;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar-fill {
            background-color: #0284c7;
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }
        .status-text {
            font-size: 14px;
            text-align: center;
            color: #475569;
            font-weight: 500;
        }
        .alert {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
            font-weight: 600;
        }
        .alert-error {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background-color: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>

<!-- Lock Screen -->
<div class="lock-screen" id="lockScreen">
    <div class="lock-card">
        <h3>Protected Access 🔒</h3>
        <p>Please enter the access password to continue.</p>
        <div class="form-group" style="margin-bottom: 15px;">
            <input type="password" id="accessPassInput" placeholder="Enter Password" required>
        </div>
        <button id="loginBtn" onclick="verifyAccess()" class="btn-submit" style="width: 100%;">Unlock App</button>
        <div class="alert alert-error" id="lockError" style="margin-top: 12px;">Wrong Password! ❌</div>
    </div>
</div>

<!-- Main Container Layout -->
<div class="container" id="mainContainer">
    <h2>Clean Direct Email Dispatcher</h2>

    <form id="emailForm">
        <!-- Row 1: Sender Name & Your Gmail -->
        <div class="row">
            <div class="col">
                <label for="senderName">Sender Name</label>
                <input type="text" id="senderName" placeholder="e.g. John Doe" required>
            </div>
            <div class="col">
                <label for="gmailUser">Your Gmail</label>
                <input type="email" id="gmailUser" placeholder="your.email@gmail.com" required>
            </div>
        </div>

        <!-- Row 2: App Password & Subject -->
        <div class="row">
            <div class="col">
                <label for="appPass">App Password</label>
                <input type="password" id="appPass" placeholder="16-digit app password" required>
            </div>
            <div class="col">
                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="Enter email subject" required>
            </div>
        </div>

        <!-- Row 3: Message Body & Recipients -->
        <div class="row">
            <div class="col">
                <label for="body">Message Body (Plain Text Only)</label>
                <textarea id="body" rows="6" placeholder="Type simple text message..." required></textarea>
            </div>
            <div class="col">
                <label for="emailListText">Recipients (comma or newline)</label>
                <textarea id="emailListText" rows="6" placeholder="user1@example.com&#10;user2@example.com" required></textarea>
            </div>
        </div>

        <!-- Row 4: Action Buttons (Send & All Logout) -->
        <div class="btn-row">
            <button type="submit" id="sendBtn" class="btn-submit">Send Emails</button>
            <button type="button" class="btn-logout" id="logoutBtn" title="Double Click to Logout">All Logout</button>
        </div>
    </form>

    <div class="progress-box" id="progressBox">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusText">Verifying credentials & sending...</div>
    </div>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>
</div>

<script>
    const CORRECT_ACCESS_PASS = "##";

    const lockScreen = document.getElementById('lockScreen');
    const mainContainer = document.getElementById('mainContainer');
    const accessPassInput = document.getElementById('accessPassInput');
    const lockError = document.getElementById('lockError');
    const logoutBtn = document.getElementById('logoutBtn');

    function verifyAccess() {
        if (accessPassInput.value === CORRECT_ACCESS_PASS) {
            lockScreen.style.display = 'none';
            mainContainer.style.display = 'block';
            sessionStorage.setItem('isAppUnlocked', 'true');
        } else {
            lockError.style.display = 'block';
            accessPassInput.value = '';
        }
    }

    if (sessionStorage.getItem('isAppUnlocked') === 'true') {
        lockScreen.style.display = 'none';
        mainContainer.style.display = 'block';
    }

    accessPassInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verifyAccess();
    });

    let clickTimer = null;
    logoutBtn.addEventListener('click', function() {
        if (clickTimer === null) {
            clickTimer = setTimeout(() => {
                clickTimer = null;
                alert("Please DOUBLE-CLICK the logout button to exit.");
            }, 300);
        }
    });

    logoutBtn.addEventListener('dblclick', function() {
        if (clickTimer) {
            clearTimeout(clickTimer);
            clickTimer = null;
        }
        sessionStorage.removeItem('isAppUnlocked');
        mainContainer.style.display = 'none';
        lockScreen.style.display = 'flex';
        accessPassInput.value = '';
        lockError.style.display = 'none';
    });

    const form = document.getElementById('emailForm');
    const sendBtn = document.getElementById('sendBtn');
    const progressBox = document.getElementById('progressBox');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';
        
        sendBtn.disabled = true;
        progressBox.style.display = 'block';
        progressFill.style.width = '0%';
        statusText.innerText = 'Connecting to server...';

        const payload = {
            senderName: document.getElementById('senderName').value,
            gmailUser: document.getElementById('gmailUser').value,
            appPass: document.getElementById('appPass').value,
            subject: document.getElementById('subject').value,
            body: document.getElementById('body').value,
            emailListText: document.getElementById('emailListText').value
        };

        try {
            const response = await fetch('/api/send-direct', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n\n');
                buffer = lines.pop();

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const jsonStr = line.replace('data: ', '').trim();
                        if (!jsonStr) continue;

                        const data = JSON.parse(jsonStr);

                        if (data.error) {
                            showError(data.error);
                            resetUI();
                            return;
                        }

                        if (data.progress) {
                            const percent = Math.round((data.sent / data.total) * 100);
                            progressFill.style.width = percent + '%';
                            statusText.innerText = `Sending: ${data.sent} of ${data.total} emails (${percent}%)`;
                        }

                        if (data.completed) {
                            showSuccess(`Completed! Delivered: ${data.delivered}, Failed: ${data.failed}`);
                            resetUI();
                            return;
                        }
                    }
                }
            }
        } catch (err) {
            showError('Server connection failed.');
            resetUI();
        }
    });

    function resetUI() {
        sendBtn.disabled = false;
        progressBox.style.display = 'none';
    }

    function showError(msg) {
        errorAlert.innerText = msg;
        errorAlert.style.display = 'block';
    }

    function showSuccess(msg) {
        successAlert.innerText = msg;
        successAlert.style.display = 'block';
    }
</script>

</body>
</html>
