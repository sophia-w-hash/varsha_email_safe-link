<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Mail Sender Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; margin: 0; padding: 20px; }
        .card { max-width: 650px; background: #fff; padding: 25px; border-radius: 10px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #333; text-align: center; }
        label { font-weight: 600; display: block; margin-top: 12px; color: #444; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        button { background: #28a745; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:disabled { background: #888; }
        #status { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; text-align: center; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="card">
    <h2>Bulk Mail Sender (6 Mails / Batch)</h2>
    
    <form id="mailForm">
        <div class="row">
            <div class="col">
                <label>Your Gmail ID:</label>
                <input type="email" id="gmailUser" placeholder="example@gmail.com" required>
            </div>
            <div class="col">
                <label>16-digit App Password:</label>
                <input type="password" id="appPass" placeholder="abcd efgh ijkl mnop" required>
            </div>
        </div>

        <label>Paste Client Emails (Comma, Space ya New Line me paste karein):</label>
        <textarea id="emailListText" rows="4" placeholder="client1@gmail.com&#10;client2@gmail.com&#10;client3@gmail.com" required></textarea>

        <label>Subject:</label>
        <input type="text" id="subject" placeholder="Enter Subject" required>

        <label>Email Body (HTML Supported):</label>
        <textarea id="body" rows="5" placeholder="Enter your text or HTML here..." required></textarea>

        <button type="submit" id="submitBtn">Start Mail Batch Process</button>
    </form>

    <div id="status"></div>
</div>

<script>
    document.getElementById('mailForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');

        btn.disabled = true;
        btn.innerText = "Sending Mails in Batches...";
        status.style.display = "block";
        status.className = "success";
        status.innerText = "Emails process ho rahe hain...";

        const payload = {
            gmailUser: document.getElementById('gmailUser').value,
            appPass: document.getElementById('appPass').value,
            emailListText: document.getElementById('emailListText').value,
            subject: document.getElementById('subject').value,
            body: document.getElementById('body').value
        };

        try {
            const res = await fetch('/api/send-direct', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok) {
                status.className = "success";
                status.innerText = `Process Finish! Total Emails: ${data.totalFound} | Delivered: ${data.details.successCount} | Failed: ${data.details.failedCount}`;
            } else {
                throw new Error(data.error || "Failed");
            }
        } catch (err) {
            status.className = "error";
            status.innerText = "Error: " + err.message;
        } finally {
            btn.disabled = false;
            btn.innerText = "Start Mail Batch Process";
        }
    });
</script>

</body>
</html>
