<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Email Sender - Inbox Fix</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { margin-top: 0; color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #555; }
        input, textarea, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; }
        button { background: #28a745; color: white; border: none; font-size: 16px; margin-top: 20px; cursor: pointer; }
        button:hover { background: #218838; }
        #logs { margin-top: 20px; background: #222; color: #00ff00; padding: 15px; border-radius: 5px; height: 150px; overflow-y: scroll; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>Bulk Mailer (Inbox Optimized)</h2>
    <form id="emailForm">
        <label>Gmail Address:</label>
        <input type="email" id="smtpUser" placeholder="example@gmail.com" required>

        <label>Gmail App Password (16 characters):</label>
        <input type="password" id="smtpPass" placeholder="xxxx xxxx xxxx xxxx" required>

        <label>Recipient Emails (One per line):</label>
        <textarea id="recipients" placeholder="client1@example.com&#10;client2@example.com" required></textarea>

        <label>Subject:</label>
        <input type="text" id="subject" placeholder="Quick follow up" required>

        <label>Body Text (Avoid HTML & Links for Inbox Landing):</label>
        <textarea id="bodyText" placeholder="Hi there, hope you are doing well..." required></textarea>

        <button type="submit">Start Sending Emails</button>
    </form>

    <h3>Sending Status & Logs:</h3>
    <div id="logs">Waiting to start...</div>
</div>

<script>
    document.getElementById('emailForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const logsDiv = document.getElementById('logs');
        logsDiv.innerHTML = "Initiating process...\n";

        const payload = {
            smtpUser: document.getElementById('smtpUser').value,
            smtpPass: document.getElementById('smtpPass').value,
            recipients: document.getElementById('recipients').value,
            subject: document.getElementById('subject').value,
            bodyText: document.getElementById('bodyText').value
        };

        try {
            const response = await fetch('/send-bulk-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                logsDiv.innerHTML += decoder.decode(value);
                logsDiv.scrollTop = logsDiv.scrollHeight;
            }
        } catch (err) {
            logsDiv.innerHTML += `\nError: ${err.message}`;
        }
    });
</script>

</body>
</html>
