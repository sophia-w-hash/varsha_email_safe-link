<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Mail Sender Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; margin: 0; padding: 20px; }
        .card { max-width: 650px; background: #fff; padding: 25px; border-radius: 10px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.08); position: relative; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        label { font-weight: 600; display: block; margin-top: 12px; color: #444; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        button { background: #28a745; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:disabled { background: #888; cursor: not-allowed; }
        
        /* Auth Screen */
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #eef2f5; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .auth-box { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        
        .counter-badge { text-align: right; font-weight: bold; color: #007bff; margin-top: 5px; font-size: 14px; }
        .logout-hint { font-size: 11px; color: #888; text-align: center; margin-top: 15px; cursor: pointer; user-select: none; }
    </style>
</head>
<body dblclick="handleDoubleClick()">

<!-- Password Access Screen -->
<div id="authOverlay">
    <div class="auth-box">
        <h3>Access Protected 🔐</h3>
        <input type="password" id="accessPass" placeholder="Enter Access Password">
        <button onclick="checkAccess()" style="margin-top:10px;">Unlock</button>
    </div>
</div>

<!-- Main App -->
<div class="card" id="appContent" style="display:none;">
    <h2>Bulk Mail Sender (6 Mails / Batch)</h2>
    
    <form id="mailForm">
        <div class="row">
            <div class="col">
                <label>Your Gmail ID:</label>
                <input type="email" id="gmailUser" placeholder="example@gmail.com" required>
            </div>
            <div class="col">
                <label>16-digit App Password:</label>
                <input type="password" id="appPass" placeholder="abcd efgh ijkl mnop" required>
            </div>
        </div>

        <label>Paste Client Emails:</label>
        <textarea id="emailListText" rows="4" placeholder="client1@gmail.com&#10;client2@gmail.com" oninput="updateCounter()" required></textarea>
        <div class="counter-badge" id="counter">0 Emails</div>

        <label>Subject:</label>
        <input type="text" id="subject" placeholder="Enter Subject" required>

        <label>Email Body (Plain Text):</label>
        <textarea id="body" rows="5" placeholder="Enter your text here..." required></textarea>

        <button type="submit" id="submitBtn">Send</button>
    </form>
    <div class="logout-hint">(Double click anywhere on screen to Logout)</div>
</div>

<script>
    // Security Access Setup
    function checkAccess() {
        const pass = document.getElementById('accessPass').value;
        if (pass === '##') {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            sessionStorage.setItem('isUnlocked', 'true');
        } else {
            alert('Wrong Access Password ❌');
        }
    }

    if (sessionStorage.getItem('isUnlocked') === 'true') {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
    }

    // Double Click Auto Logout
    function handleDoubleClick() {
        sessionStorage.removeItem('isUnlocked');
        location.reload();
    }

    // Live Email Counter (e.g. 20/28)
    function updateCounter() {
        const text = document.getElementById('emailListText').value;
        const emails = text.split(/[\n,\s]+/).filter(e => e.trim().includes('@') && e.trim().includes('.'));
        document.getElementById('counter').innerText = `${emails.length}/28 Emails`;
    }

    // Submit Handler
    document.getElementById('mailForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Sending...";

        const payload = {
            gmailUser: document.getElementById('gmailUser').value,
            appPass: document.getElementById('appPass').value,
            emailListText: document.getElementById('emailListText').value,
            subject: document.getElementById('subject').value,
            body: document.getElementById('body').value
        };

        try {
            const res = await fetch('/api/send-direct', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok) {
                alert(`Mail Send Successful ✅ (${data.delivered}/${data.total})`);
            } else {
                alert(data.error || "Mail Send Failed ❌");
            }
        } catch (err) {
            alert("Error: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Send";
        }
    });
</script>

</body>
</html>
